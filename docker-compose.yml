version: "3.9"

services:
  # ---------- Infrastructure ----------
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Temporal persistence ----------
  postgresql:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Temporal server ----------
  temporal:
    image: temporalio/auto-setup:1.24
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------- Temporal Web UI ----------
  temporal-ui:
    image: temporalio/ui:2.26.2
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:4200
    depends_on:
      - temporal

  # ---------- Backend API ----------
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=workflow_platform
      - JWT_SECRET=workflow-dev-secret-change-in-production
      - CORS_ORIGINS=["http://localhost:4200","http://localhost:8088"]
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
    volumes:
      - document_uploads:/data/documents
    depends_on:
      - temporal
      mongodb:
        condition: service_healthy
      postgresql:
        condition: service_healthy

  # ---------- Temporal worker ----------
  temporal-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=workflow_platform
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=workflow-queue
    depends_on:
      mongodb:
        condition: service_healthy
      temporal:
        condition: service_healthy

volumes:
  mongo_data:
  document_uploads:
  postgres_data:
